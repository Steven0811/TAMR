; All NodeMCU-32S firmware for this repo. Sources live in firmware/.
;
;   pio run                          build car_io (default)
;   pio run -e car_io -t upload      flash the car I/O board (stop the Docker stack first)
;   pio run -e rc_test -t upload     diagnostics: print receiver pulses over Serial
;   pio run -e pin_scan -t upload    diagnostics: find which GPIO carries RC PWM
;   pio device monitor               watch a diagnostic's output
;
; The diagnostics replace the car firmware on the board: flash car_io again afterwards.

[platformio]
src_dir = firmware/src
lib_dir = firmware/lib
include_dir = firmware/include
test_dir = firmware/test
default_envs = car_io

[env]
platform = espressif32@7.1.3
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
; CH340 on the NodeMCU-32S; the by-id path stays stable when the CP2102 sensors are plugged in
upload_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
monitor_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0

; Car I/O board: SHARP GP2Y0A21 (GPIO36) + RC receiver (GPIO34/35/32) -> micro-ROS over serial
[env:car_io]
build_src_filter = +<car_io/>
board_microros_distro = humble
board_microros_transport = serial
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio.git#cfee17faffaa532363b7151dd13af6a85c69d3c1

; Prints receiver pulse widths read with the same rc_input library as car_io
[env:rc_test]
build_src_filter = +<rc_test/>

; Polls every usable GPIO and reports which ones carry RC PWM
[env:pin_scan]
build_src_filter = +<pin_scan/>
